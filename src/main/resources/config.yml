# MaoMap performance settings
capture:
  # Maximum number of chunk snapshots started per server tick.
  chunks-per-tick: 1
  # Maximum number of pending chunk snapshots. New requests are coalesced by chunk.
  max-queue-size: 256
  # Never force-load chunks for map capture.
  loaded-chunks-only: true

render:
  # Number of background image-rendering workers.
  worker-threads: 2
  # Maximum number of render tasks waiting behind active workers.
  queue-capacity: 128
  # Tile size in pixels (currently one 16x16 tile per chunk).
  tile-size: 16
  output-directory: tiles
